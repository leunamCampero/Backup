[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclelts"
version = "1.0.0"
description = "Cycling networks with a Level of Traffic Stress, their link with bike mode share, and where to invest (MLCC / genetic algorithm)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.2",
    "shapely>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "plotly>=5.15",
    "geojson>=3.0",
    "xlrd>=2.0.1",
    "openpyxl>=3.1",
]

[tool.setuptools]
packages = ["cyclelts"]
